[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "tensor0"
version = "0.0.0"
description = "Rust-backed metadata and JAX-backed symmetric TensorMap core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["jax", "tensor", "symmetry", "tensor-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax>=0.4",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "maturin>=1.5,<2",
    "pyright>=1.1.411",
    "pytest>=8.0",
]
bench = [
    "matplotlib>=3.9",
]

[tool.maturin]
module-name = "tensor0._native"
manifest-path = "crates/tensor0-py/Cargo.toml"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "examples", "benchmarks"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

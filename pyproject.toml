[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "tensor0"
version = "0.0.0"
description = "Rust-backed metadata and JAX-backed symmetric TensorMap core"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "maturin>=1.5,<2",
    "pytest>=8.0",
]

[tool.maturin]
module-name = "tensor0._native"
manifest-path = "crates/tensor0-py/Cargo.toml"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

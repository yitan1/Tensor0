[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "tensor0"
version = "0.2.0"
description = "Rust-backed metadata and JAX-backed symmetric TensorMap core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "crates/tensor0-py/vendor/jaxlib-0.10.1/LICENSE.txt"]
keywords = ["jax", "tensor", "symmetry", "tensor-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax==0.10.1",
    "jaxlib==0.10.1",
    "numpy>=2.0",
]

[project.optional-dependencies]
cuda12 = [
    "tensor0-cuda12==0.2.0",
    "jax[cuda12]==0.10.1",
    "nvidia-cuda-runtime-cu12>=12.9.79,<13",
]

[project.urls]
Homepage = "https://github.com/yitan1/Tensor0"
Documentation = "https://yitan1.github.io/Tensor0/"
Repository = "https://github.com/yitan1/Tensor0"
Issues = "https://github.com/yitan1/Tensor0/issues"
Changelog = "https://github.com/yitan1/Tensor0/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "maturin>=1.5,<2",
    "pyright>=1.1.411",
    "pytest>=8.0",
]
bench = [
    "matplotlib>=3.9",
]

[tool.maturin]
module-name = "tensor0._native"
manifest-path = "crates/tensor0-py/Cargo.toml"
python-source = "src"
features = ["pyo3/extension-module"]
exclude = ["src/tensor0/_stride_cuda.so", "crates/tensor0-cuda12/**"]
include = [
    { path = "crates/tensor0-py/native/**/*.cc", format = "sdist" },
    { path = "crates/tensor0-py/native/**/*.h", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "examples", "benchmarks"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

[tool.uv.sources]
tensor0-cuda12 = { path = "crates/tensor0-cuda12", editable = false }

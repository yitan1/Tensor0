name: Linux CPU release artifacts

# Artifact-only: no PyPI credentials, publishing, tag creation or release uploads.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "1"
  TENSOR0_CUDA: "0"
  JAX_PLATFORMS: cpu

jobs:
  build:
    name: CPython 3.11 / manylinux_2_28 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject placeholder releases
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --python 3.11 python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG']
          rust_version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if version == '0.0.0' or tag in {'0.0.0', 'v0.0.0'}:
              raise SystemExit('Placeholder 0.0.0 is allowed only for manual artifact validation, not a release.')
          if rust_version != version or tag not in {version, f'v{version}'}:
              raise SystemExit('Release tag must match both Python and Rust package versions.')
          PY
      - name: Build sdist without installing the project
        run: uvx --python 3.11 --from maturin==1.13.1 maturin sdist --out dist
      - name: Inspect and extract the sdist
        run: |
          uv run --no-project --python 3.11 python .github/scripts/check_artifacts.py dist/*.tar.gz --extract artifact-source
      - name: Build portable wheel exclusively from extracted sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.13.1"
          manylinux: "2_28"
          # The manylinux image supplies a modern C++20 GCC via its PATH.
          # Do not use build.rs's /usr/bin/c++ default on AlmaLinux 8.
          before-script-linux: export CXX=g++; export CARGO_BUILD_JOBS=1; export TENSOR0_CUDA=0; g++ --version
          working-directory: artifact-source/source
          command: build
          # The inspected sdist contains its generated Cargo.lock.
          args: >-
            --release --locked --strip --auditwheel repair
            --interpreter python3.11
            --out ../../dist
      - name: Check wheel contents and binary compatibility
        run: |
          uv run --no-project --python 3.11 python .github/scripts/check_artifacts.py dist/*.whl
          uvx --python 3.11 --from auditwheel auditwheel show dist/*.whl
      - name: Install wheel in an isolated environment
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          uv pip check --python "$RUNNER_TEMP/wheel-test/bin/python"
      - name: Installed-wheel public CPU smoke and examples outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-test/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py"
          "$RUNNER_TEMP/wheel-test/bin/python" -I "$GITHUB_WORKSPACE/examples/basic_usage.py"
          "$RUNNER_TEMP/wheel-test/bin/python" -I "$GITHUB_WORKSPACE/examples/contractions.py"
      - name: Record artifact provenance and publication handoff
        run: |
          sha256sum dist/*.tar.gz dist/*.whl | tee dist/SHA256SUMS
          {
            echo '## Artifact-only handoff'
            echo "Source commit: $GITHUB_SHA"
            echo 'Target: Linux x86_64 CPU, CPython 3.11, manylinux_2_28 (glibc >= 2.28).'
            echo 'Includes sdist, wheel built from that sdist, and SHA256SUMS.'
            echo 'Wheel was inspected and installed outside the checkout; public dense conversion, composition, permutation, jit and grad were checked.'
            echo 'No PyPI publication or tag creation occurs. Download artifacts from this run.'
            echo 'Before any future publication: select a real version (currently 0.0.0), review licenses/metadata, run the complete Linux CPU CI, and document tested Python/platform coverage.'
            echo 'CUDA, other architectures, macOS/Windows, and additional Python wheel ABIs are not validated here.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tensor0-linux-x86_64-cp311-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

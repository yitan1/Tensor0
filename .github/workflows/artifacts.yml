name: CPU release artifacts (Linux + macOS ARM64)

# Manual preparation only: no publishing, tag creation or release uploads.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "1"
  JAX_PLATFORMS: cpu

jobs:
  sdist:
    name: Build source distribution once
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and inspect sdist without installing the project
        run: |
          uvx --python 3.11 --from maturin==1.13.1 maturin sdist --out dist
          uv run --no-project --python 3.11 python .github/scripts/check_artifacts.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tensor0-sdist-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheel:
    name: CPython ${{ matrix.python }} / manylinux_2_28 x86_64
    needs: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: tensor0-sdist-${{ github.sha }}
          path: dist
      - name: Inspect and extract the shared sdist
        run: uv run --no-project python .github/scripts/check_artifacts.py dist/*.tar.gz --extract artifact-source
      - name: Build portable wheel exclusively from extracted sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.13.1"
          manylinux: "2_28"
          # AlmaLinux 8's default /usr/bin/c++ is too old for our C++20 code.
          before-script-linux: export CXX=g++; export CARGO_BUILD_JOBS=1; g++ --version
          working-directory: artifact-source/source
          command: build
          args: >-
            --release --locked --strip --auditwheel repair
            --interpreter python${{ matrix.python }}
            --out ../../dist
      - name: Check wheel contents and binary compatibility
        run: |
          uv run --no-project python .github/scripts/check_artifacts.py dist/*.whl --release-core
          uvx --from auditwheel auditwheel show dist/*.whl
      - name: Install wheel in an isolated environment
        run: |
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" pip
          "$RUNNER_TEMP/wheel-test/bin/python" -I -m pip install dist/*.whl
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" --group dev --group bench
          uv pip check --python "$RUNNER_TEMP/wheel-test/bin/python"
      - name: Installed-wheel public CPU smoke and examples outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-test/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"/dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/python" -I "$GITHUB_WORKSPACE/examples/basic_usage.py"
          "$RUNNER_TEMP/wheel-test/bin/python" -I "$GITHUB_WORKSPACE/examples/contractions.py"
      - name: Installed-wheel native major operations, JIT and AD (intermediate ABIs)
        if: matrix.python == '3.12' || matrix.python == '3.13'
        run: |
          "$RUNNER_TEMP/wheel-test/bin/python" -I -m pytest -q -ra \
            tests/stride/jax/ad/test_copy.py::test_broadcast_map_transpose_accumulates_and_supports_nested_ad \
            tests/stride/jax/ad/test_update.py::test_update_jvp_vjp_and_linear_transpose \
            tests/stride/jax/ad/test_reduction.py::test_mixed_reduction_forward_coefficient_ad_batch_and_nested_transpose \
            tests/stride/jax/ad/test_dot.py::test_vmap_symbolic_zero_and_native_lowering \
            tests/stride/jax/ad/test_accumulation.py::test_compact_vmap_and_float32_derivatives_use_native
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.python == '3.11' || matrix.python == '3.14'
      - name: Resolve locked host Cargo dependencies for offline build fixtures
        if: matrix.python == '3.11' || matrix.python == '3.14'
        # The wheel build ran in manylinux, not necessarily the host Cargo cache.
        run: cargo fetch --locked
      - name: Full installed-wheel Python suite (baseline and highest ABI)
        if: matrix.python == '3.11' || matrix.python == '3.14'
        # Linux Rust/C++ contracts run once in the required same-commit CI.
        run: >-
          "$RUNNER_TEMP/wheel-test/bin/python" -I -m pytest tests -q -ra
          --ignore=tests/stride/native/cpp/test_contracts.py
      - uses: actions/upload-artifact@v4
        with:
          name: tensor0-wheel-${{ matrix.python }}-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  macos-wheel:
    name: CPython ${{ matrix.python }} / macOS 15 ARM64 CPU
    needs: sdist
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      CXX: /usr/bin/clang++
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: tensor0-sdist-${{ github.sha }}
          path: dist
      - name: Prepare CPU-only test dependencies without installing the project
        run: uv sync --group dev --group bench --no-install-project
      - name: Verify macOS 15 ARM64 host, Rust and pinned FFI headers
        run: |
          uname -a
          sw_vers
          sysctl hw.memsize hw.ncpu
          /usr/bin/clang++ --version
          xcodebuild -version
          .venv/bin/python -I .github/scripts/macos_release.py host
      - name: Inspect and extract the producer's shared sdist outside checkout
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/macos-release.XXXXXX")
          echo "MACOS_CORE_WORK=$work" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$work/target" >> "$GITHUB_ENV"
          .venv/bin/python .github/scripts/check_artifacts.py dist/*.tar.gz --extract "$work/source"
      - name: Build one wheel from the shared sdist with a fresh native target
        run: |
          cd "$MACOS_CORE_WORK/source/source"
          "$GITHUB_WORKSPACE/.venv/bin/maturin" build --release --locked --strip \
            -i "$GITHUB_WORKSPACE/.venv/bin/python" --out "$GITHUB_WORKSPACE/dist"
      - name: Inspect and install the original ARM64 wheel (no repacking)
        run: |
          .venv/bin/python .github/scripts/check_artifacts.py dist/*.whl --release-core
          .venv/bin/python -I .github/scripts/macos_release.py inspect dist/*.whl
          uv pip install --python .venv/bin/python pip
          .venv/bin/python -I -m pip install --no-deps dist/*.whl
          uv pip check --python .venv/bin/python
          .venv/bin/python -I .github/scripts/macos_release.py installed dist/*.whl
      - name: Installed-wheel CPU smoke and examples outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"/dist/*.whl
          "$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/examples/basic_usage.py"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/examples/contractions.py"
      - name: Rust core tests (one macOS ABI; no extension rebuild)
        if: matrix.python == '3.11'
        run: cargo test -p tensor0-core
      - name: Standalone native C++ contracts (once on macOS)
        if: matrix.python == '3.11'
        run: .venv/bin/python -I -m pytest tests/stride/native/cpp/test_contracts.py -q -ra --junitxml=macos-cpp.xml
      - name: Installed-wheel native major operations, JIT and AD (intermediate ABIs)
        if: matrix.python == '3.12' || matrix.python == '3.13'
        run: |
          .venv/bin/python -I -m pytest -q -ra --junitxml=macos-compat.xml \
            tests/stride/jax/ad/test_copy.py::test_broadcast_map_transpose_accumulates_and_supports_nested_ad \
            tests/stride/jax/ad/test_update.py::test_update_jvp_vjp_and_linear_transpose \
            tests/stride/jax/ad/test_reduction.py::test_mixed_reduction_forward_coefficient_ad_batch_and_nested_transpose \
            tests/stride/jax/ad/test_dot.py::test_vmap_symbolic_zero_and_native_lowering \
            tests/stride/jax/ad/test_accumulation.py::test_compact_vmap_and_float32_derivatives_use_native
      - name: Full installed-wheel Python suite (baseline and highest ABI)
        if: matrix.python == '3.11' || matrix.python == '3.14'
        run: >-
          .venv/bin/python -I -m pytest tests -q -ra --junitxml=macos-pytest.xml
          --ignore=tests/stride/native/cpp/test_contracts.py
      - uses: actions/upload-artifact@v4
        with:
          name: tensor0-wheel-macos-${{ matrix.python }}-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
      - name: Preserve macOS test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensor0-macos-tests-${{ matrix.python }}-${{ github.sha }}
          path: |
            macos-pytest.xml
            macos-compat.xml
            macos-cpp.xml
          if-no-files-found: warn
          retention-days: 30

  assemble:
    name: Assemble tested distributions (no rebuild)
    needs: [sdist, wheel, macos-wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: tensor0-sdist-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: tensor0-wheel-*-${{ github.sha }}
          merge-multiple: true
          path: dist
      - name: Check matrix completeness and record basename checksums
        shell: bash
        run: |
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -name '*.whl' | wc -l)" -eq 8
          for abi in cp311 cp312 cp313 cp314; do
            for platform in manylinux_2_28_x86_64 macosx_15_0_arm64; do
              test "$(find dist -name "*-${abi}-${abi}-${platform}.whl" | wc -l)" -eq 1
            done
          done
          (cd dist && sha256sum *.tar.gz *.whl > SHA256SUMS)
          python .github/scripts/cuda_candidate.py files dist
          {
            echo '## Tested Linux x86_64 + macOS ARM64 CPU candidate'
            echo "Source commit: $GITHUB_SHA"
            echo "Candidate run: $GITHUB_RUN_ID"
            echo 'One shared sdist and eight wheels: CPython 3.11–3.14, manylinux_2_28 x86_64 + macOS 15 ARM64.'
            echo 'All eight wheels passed inspection, exact installed-wheel checks, smoke/examples and native major-operation JIT/AD contracts; Python 3.11 and 3.14 passed full installed-wheel Python tests on each platform. Linux Rust/C++ contracts require same-commit CI; macOS contracts ran once on 3.11.'
            echo 'Publish only this assembled artifact; no rebuild. No publication occurs here.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tensor0-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

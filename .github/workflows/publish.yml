name: Publish tested release to PyPI

# Deliberately manual: a tag or GitHub release never publishes automatically.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Linux + macOS CPU release artifacts run on main
        required: true
        type: string
      cuda_candidate_run_id:
        description: Successful same-commit manual CUDA candidate including all four ABI jobs
        required: true
        type: string
      release_tag:
        description: Existing chosen stable vX.Y.Z tag matching all source versions
        required: true
        type: string
      acceptance_asset_id:
        description: cuda-acceptance.tar.gz asset ID on this tag's GitHub release
        required: true
        type: string
      acceptance_sha256:
        description: Reviewed acceptance archive SHA256 (lowercase hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify paired candidates, stable tag, CI and manual acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CPU_RUN_ID: ${{ inputs.candidate_run_id }}
      CUDA_RUN_ID: ${{ inputs.cuda_candidate_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ACCEPTANCE_ASSET_ID: ${{ inputs.acceptance_asset_id }}
      ACCEPTANCE_SHA256: ${{ inputs.acceptance_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify producer identities, tag, source versions and exact-commit jobs
        id: provenance
        run: |
          python .github/scripts/verify_release.py provenance \
            --repository "$REPOSITORY" --cpu-run-id "$CPU_RUN_ID" \
            --cuda-run-id "$CUDA_RUN_ID" --release-tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: tensor0-dist-${{ steps.provenance.outputs.sha }}
          path: cpu-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: tensor0-cuda-build-${{ steps.provenance.outputs.sha }}
          path: cuda-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.cuda_candidate_run_id }}
      - name: Verify eleven exact distributions and pinned manual evidence (no rebuild)
        env:
          CANDIDATE_SHA: ${{ steps.provenance.outputs.sha }}
        run: |
          python .github/scripts/verify_release.py stage \
            --repository "$REPOSITORY" --cpu-run-id "$CPU_RUN_ID" \
            --cuda-run-id "$CUDA_RUN_ID" --release-tag "$RELEASE_TAG" \
            --sha "$CANDIDATE_SHA" --asset-id "$ACCEPTANCE_ASSET_ID" \
            --evidence-sha256 "$ACCEPTANCE_SHA256" \
            --cpu cpu-candidate --cuda cuda-candidate --dist dist --evidence evidence
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pypi-dist-${{ steps.provenance.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-evidence-${{ steps.provenance.outputs.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified binaries (no checkout or build)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Required reviewers/restrictions and BOTH PyPI publishers need user setup.
    environment:
      name: pypi
      url: https://pypi.org/p/tensor0
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pypi-dist-${{ needs.verify.outputs.sha }}
          path: dist
      - name: Publish both projects via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Numerical C++ units can each consume several GiB. Share one Cargo slot.
  CARGO_BUILD_JOBS: "1"
  JAX_PLATFORMS: cpu

jobs:
  maintenance:
    name: Maintenance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test maintenance rules
        run: python3 -m unittest discover -s tests/ci -p test_maintenance.py
      - name: Check entry documents and production imports
        run: python3 .github/scripts/check_maintenance.py

  changes:
    name: Classify daily CI changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_cpu: ${{ steps.scope.outputs.run_cpu }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine CPU verification scope
        id: scope
        run: python3 .github/scripts/ci_changes.py

  test:
    name: Linux x86_64 / Python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.run_cpu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python == '3.15' && '3.15.0' || matrix.python }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies, including benchmark plotting tests
        run: uv sync --group dev --group bench --no-install-project
      - name: Require a final CPython release (not an alpha or beta)
        run: .venv/bin/python -c 'import sys; assert sys.implementation.name == "cpython" and sys.version_info.releaselevel == "final", sys.version'
      - name: Clean native CPU build
        # No native target cache is restored: missing headers must not be masked.
        run: uv run --no-sync maturin develop
      - name: Require the pinned native CPU FFI backend
        run: uv run --no-sync python -c 'from tests.stride.support.availability import native_available; assert native_available()'
      - name: Rust workspace tests (once on Linux)
        if: matrix.python == '3.12'
        run: cargo test --workspace
      - name: Standalone native C++ contracts (once on Linux)
        if: matrix.python == '3.12'
        run: uv run --no-sync pytest tests/stride/native/cpp/test_contracts.py -q -ra
      - name: Full Python tests (including ABI-dependent build checks)
        run: uv run --no-sync pytest tests -q -ra --ignore=tests/stride/native/cpp/test_contracts.py
      - name: Run public examples
        run: |
          uv run --no-sync python examples/basic_usage.py
          uv run --no-sync python examples/contractions.py

  typecheck:
    name: Public-package Pyright (Python 3.12)
    needs: changes
    if: needs.changes.outputs.run_cpu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install type-check dependencies without building Tensor0
        run: uv sync --group dev --group bench --no-install-project
      - name: Blocking type check of source, examples and benchmarks
        run: uv run --no-sync pyright src examples benchmarks
      # Tests currently include intentional invalid-type calls and Optional GPU
      # statistics debt. Report the complete configured scope without suppressing
      # diagnostics, but do not treat this advisory report as a passing gate.
      - name: Advisory full Pyright report (includes existing test typing debt)
        id: full_pyright
        if: always()
        continue-on-error: true
        shell: bash
        run: uv run --no-sync pyright 2>&1 | tee pyright-full.log
      - name: Upload advisory full Pyright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-pyright-full-${{ github.sha }}
          path: pyright-full.log
          if-no-files-found: warn
      - name: Summarize advisory typing outcome
        if: always()
        env:
          REPORT_OUTCOME: ${{ steps.full_pyright.outcome }}
        run: |
          {
            echo '## Advisory full Pyright report — not a blocking gate'
            echo "Diagnostic step outcome: $REPORT_OUTCOME"
            echo 'The blocking typing gate checks src, examples and benchmarks.'
            echo 'The full configured scope also includes tests, where existing debt includes intentional invalid-input calls and Optional GPU statistics.'
            echo 'See the advisory-pyright-full artifact for all diagnostics. A green job does not imply that the full configured Pyright scope passed.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REPORT_OUTCOME" != success ]; then
            echo '::warning::Advisory full Pyright report did not pass; inspect the diagnostic artifact. The blocking package typing gate has separate status.'
          fi

  result:
    name: CI result
    if: always()
    needs: [changes, maintenance, test, typecheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected verification jobs
        env:
          MAINTENANCE_RESULT: ${{ needs.maintenance.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CPU: ${{ needs.changes.outputs.run_cpu }}
          TEST_RESULT: ${{ needs.test.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          if [ "$MAINTENANCE_RESULT" != success ]; then
            echo 'Maintenance checks failed, were cancelled, or unexpectedly skipped.'
            exit 1
          fi
          if [ "$CHANGES_RESULT" != success ]; then
            echo 'Change classification failed or was cancelled.'
            exit 1
          fi
          if [ "$RUN_CPU" = false ] && [ "$TEST_RESULT" = skipped ] && [ "$TYPECHECK_RESULT" = skipped ]; then
            echo 'Documentation-only: CPU tests and Pyright were not run.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RUN_CPU" = true ] && [ "$TEST_RESULT" = success ] && [ "$TYPECHECK_RESULT" = success ]; then
            echo 'Both CPU endpoints and blocking public Pyright passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Required CPU verification failed, was cancelled, or unexpectedly skipped.'
            exit 1
          fi

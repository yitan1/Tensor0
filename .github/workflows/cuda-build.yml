name: CUDA build checks (no GPU execution)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.*'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/scripts/**'
      - '.github/workflows/cuda-build.yml'
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful same-commit manual CPU artifacts.yml run on main
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cuda-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify CPU candidate provenance before downloading
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/artifacts.yml" > "$RUNNER_TEMP/workflow.json"
          python .github/scripts/cuda_candidate.py run --run-json "$RUNNER_TEMP/run.json" \
            --workflow-json "$RUNNER_TEMP/workflow.json" --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN_ID"
  build:
    needs: verify-candidate
    if: always() && (github.event_name != 'workflow_dispatch' || needs.verify-candidate.result == 'success')
    name: CUDA 12.9 / sm_80 / CPython 3.12 (compile and CPU smoke only)
    runs-on: ubuntu-24.04
    # Pin the glibc 2.28 / GCC 14 baseline; NVCC 12.9 supports GCC through 14.
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      TENSOR0_CUDA_ARCH: sm_80
      CUDA_HOME: /usr/local/cuda
      CXX: g++
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: tensor0-dist-${{ github.sha }}
          path: ${{ runner.temp }}/cpu-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Install pinned CUDA build components (no NVIDIA driver)
        run: |
          mkdir -p "$CUDA_HOME" "$CUDA_HOME/component-licenses" "$RUNNER_TEMP/cuda-toolkit"
          cd "$RUNNER_TEMP/cuda-toolkit"
          # Official CUDA 12.9.1 redistrib manifest, Linux x86_64 archives.
          while read -r component version digest; do
            archive="${component}-linux-x86_64-${version}-archive.tar.xz"
            curl --fail --location --retry 3 --output "$archive" \
              "https://developer.download.nvidia.com/compute/cuda/redist/${component}/linux-x86_64/${archive}"
            echo "$digest  $archive" | sha256sum --check --strict
            tar -xf "$archive"
            directory="${archive%.tar.xz}"
            cp -a "$directory"/. "$CUDA_HOME/"
            cp "$directory/LICENSE" "$CUDA_HOME/component-licenses/$component.txt"
          done <<'COMPONENTS'
          cuda_nvcc 12.9.86 7a1a5b652e5ef85c82b721d10672fc9a2dbaab44e9bd3c65a69517bf53998c35
          cuda_cudart 12.9.79 1f6ad42d4f530b24bfa35894ccf6b7209d2354f59101fd62ec4a6192a184ce99
          cuda_cccl 12.9.27 8b1a5095669e94f2f9afd7715533314d418179e9452be61e2fde4c82a3e542aa
          COMPONENTS
          "$CUDA_HOME/bin/nvcc" --version
          "$CXX" --version
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.13.0"
          python-version: '3.12'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and inspect source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/cuda-dist"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            uv run --no-project --python 3.12 python .github/scripts/cuda_candidate.py files "$RUNNER_TEMP/cpu-candidate"
            cp "$RUNNER_TEMP"/cpu-candidate/*.whl "$RUNNER_TEMP"/cpu-candidate/*.tar.gz "$RUNNER_TEMP/cuda-dist/"
          else
            uvx --python 3.12 --from maturin==1.15.0 maturin sdist --out "$RUNNER_TEMP/cuda-dist"
          fi
          uv run --no-project --python 3.12 python .github/scripts/check_artifacts.py \
            "$RUNNER_TEMP"/cuda-dist/tensor0-*.tar.gz --extract "$RUNNER_TEMP/cuda-source"
          uv build --no-sources --sdist crates/tensor0-cuda12 --out-dir "$RUNNER_TEMP/cuda-dist"
          uv run --no-project --python 3.12 python .github/scripts/check_artifacts.py --cuda \
            "$RUNNER_TEMP"/cuda-dist/tensor0_cuda12-*.tar.gz --extract "$RUNNER_TEMP/addon-source"
          uv venv --python 3.12 "$RUNNER_TEMP/cuda-test"
      - name: Build unified CPU core wheel from sdist
        if: github.event_name != 'workflow_dispatch'
        working-directory: ${{ runner.temp }}/cuda-source/source
        run: |
          uvx --python 3.12 --from maturin==1.15.0 maturin build \
            --release --locked --compatibility linux --auditwheel skip \
            --interpreter "$RUNNER_TEMP/cuda-test/bin/python" \
            --out "$RUNNER_TEMP/cuda-dist" 2>&1 | tee "$RUNNER_TEMP/cuda-build.log"
          # The companion is built independently below; this is always the CPU core.
          auditwheel --version
      - name: Build companion wheel from its independent sdist
        working-directory: ${{ runner.temp }}/addon-source/source
        run: |
          uv build --no-sources --wheel --out-dir "$RUNNER_TEMP/cuda-raw-addon" \
            2>&1 | tee "$RUNNER_TEMP/addon-build.log"
      - name: Repair the raw companion to the actual manylinux policy
        run: |
          # Never exclude CUDA: the forwarder must eliminate that ELF dependency.
          auditwheel show "$RUNNER_TEMP"/cuda-raw-addon/*.whl
          auditwheel repair --plat manylinux_2_28_x86_64 --only-plat \
            --wheel-dir "$RUNNER_TEMP/cuda-dist" "$RUNNER_TEMP"/cuda-raw-addon/*.whl
      - name: Inspect and install the core wheel in isolation
        run: |
          uv run --no-project --python 3.12 python .github/scripts/check_artifacts.py "$RUNNER_TEMP"/cuda-dist/tensor0-*-cp312-cp312-*linux*_x86_64.whl
          uv run --no-project --python 3.12 python .github/scripts/check_artifacts.py --cuda "$RUNNER_TEMP"/cuda-dist/tensor0_cuda12-*.whl
          for wheel in "$RUNNER_TEMP"/cuda-dist/*_x86_64.whl; do auditwheel show "$wheel"; done
          uv pip install --python "$RUNNER_TEMP/cuda-test/bin/python" "$RUNNER_TEMP"/cuda-dist/tensor0-*-cp312-cp312-*linux*_x86_64.whl
          uv pip check --python "$RUNNER_TEMP/cuda-test/bin/python"
      - name: Verify core CPU behavior before adding the companion
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/cuda-test/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py"
          "$RUNNER_TEMP/cuda-test/bin/python" -I - <<'PY'
          import hashlib
          from pathlib import Path
          import os
          from tensor0 import _native
          assert not _native._stride_cuda_available()
          assert _native._stride_cuda_registration() == {}
          binary = Path(_native.__file__)
          (Path(os.environ['RUNNER_TEMP']) / 'core-before.sha256').write_text(hashlib.sha256(binary.read_bytes()).hexdigest())
          PY
          uv pip install --no-deps --python "$RUNNER_TEMP/cuda-test/bin/python" "$RUNNER_TEMP"/cuda-dist/tensor0_cuda12-*.whl
      - name: Inspect direct ELF dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/cuda-elf"
          for wheel in "$RUNNER_TEMP"/cuda-dist/tensor0-*-cp312-cp312-*linux*_x86_64.whl "$RUNNER_TEMP"/cuda-dist/tensor0_cuda12-*.whl; do
            "$RUNNER_TEMP/cuda-test/bin/python" -I -m zipfile -e "$wheel" "$RUNNER_TEMP/cuda-elf"
          done
          core=("$RUNNER_TEMP"/cuda-elf/tensor0/_native*.so)
          companion="$RUNNER_TEMP/cuda-elf/tensor0_cuda12/_stride_cuda.so"
          test "${#core[@]}" -eq 1
          readelf -d "${core[0]}" | tee "$RUNNER_TEMP/core-elf.txt"
          readelf -d "$companion" | tee "$RUNNER_TEMP/companion-elf.txt"
          if grep -E 'NEEDED.*(libcuda|libcudart)' "$RUNNER_TEMP/core-elf.txt"; then
            echo 'Core extension must not depend on CUDA' >&2
            exit 1
          fi
          if grep -E 'NEEDED.*(libcu|libnv|libnccl|libnvidia)' "$RUNNER_TEMP/companion-elf.txt"; then
            echo 'Companion must dynamically resolve the external pip runtime, not link NVIDIA libraries' >&2
            exit 1
          fi
          nm -D "$companion" | tee "$RUNNER_TEMP/companion-symbols.txt"
          if grep -E ' (cuda|__cuda)' "$RUNNER_TEMP/companion-symbols.txt"; then
            echo 'CUDA wrappers must be local and no unresolved CUDA calls are allowed' >&2
            exit 1
          fi
          for symbol in Tensor0CudaForwarderStatusV1 Tensor0CudaForwarderRuntimeV1 Tensor0CudaForwarderErrorV1; do
            grep -E " T $symbol$" "$RUNNER_TEMP/companion-symbols.txt"
          done
          # No build-toolkit paths may enter the wheel ($ORIGIN paths are allowed).
          if grep -E '(RPATH|RUNPATH).*(/usr/local/cuda|cuda-source|cuda-toolkit|/target/)' \
            "$RUNNER_TEMP/core-elf.txt" "$RUNNER_TEMP/companion-elf.txt"; then
            echo 'Build paths leaked into ELF runtime search paths' >&2
            exit 1
          fi
      - name: Verify CPU behavior without the CUDA runtime or a GPU
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/cuda-test/bin/python" -I - <<'PY'
          import importlib.metadata
          from tensor0 import _native
          try:
              importlib.metadata.distribution('nvidia-cuda-runtime-cu12')
          except importlib.metadata.PackageNotFoundError:
              pass
          else:
              raise AssertionError('CPU stage must not have the NVIDIA runtime')
          assert _native._stride_cuda_available(), 'Expected an installed companion'
          try:
              _native._stride_cuda_registration()
          except RuntimeError as error:
              assert 'runtime' in str(error).lower() and 'tensor0[cuda12]' in str(error)
          else:
              raise AssertionError('Expected actionable missing-runtime error')
          PY
          "$RUNNER_TEMP/cuda-test/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py"
      - name: Install only the external runtime and verify registration without a GPU
        working-directory: ${{ runner.temp }}
        run: |
          uv pip install --python "$RUNNER_TEMP/cuda-test/bin/python" \
            'nvidia-cuda-runtime-cu12>=12.9.79,<13'
          uv pip check --python "$RUNNER_TEMP/cuda-test/bin/python"
          "$RUNNER_TEMP/cuda-test/bin/python" -I - <<'PY'
          from tensor0 import _native
          import hashlib
          import os
          from pathlib import Path
          assert hashlib.sha256(Path(_native.__file__).read_bytes()).hexdigest() == (Path(os.environ['RUNNER_TEMP']) / 'core-before.sha256').read_text()
          registration = _native._stride_cuda_registration()
          assert len(registration) == 35
          for operation in ('copy', 'update', 'accumulation', 'dot', 'reduction'):
              for dtype in ('f32', 'f64', 'c64', 'c128'):
                  assert f'{operation}_{dtype}' in registration
              stats = getattr(_native, f'_stride_cuda_{operation}_prepared_stats')()
              assert stats is not None and len(stats) == 2
          PY
      - name: Record candidate provenance for manual GPU acceptance
        env:
          CPU_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          "$RUNNER_TEMP/cuda-test/bin/python" -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          directory = Path(os.environ['RUNNER_TEMP']) / 'cuda-dist'
          wheel, = directory.glob('tensor0-*-cp312-cp312-*linux*_x86_64.whl')
          cuda_wheel, = directory.glob('tensor0_cuda12-*.whl')
          def version(*args):
              return subprocess.check_output(args, text=True).strip()
          with wheel.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          info = {
              'source_commit': os.environ['GITHUB_SHA'],
              'release_candidate': os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch',
              'cpu_candidate_run_id': os.environ.get('CPU_CANDIDATE_RUN_ID') or None,
              'cpu_candidate_run_url': (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['CPU_CANDIDATE_RUN_ID']}" if os.environ.get('CPU_CANDIDATE_RUN_ID') else None),
              'sdists': {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in directory.glob('*.tar.gz')},
              'wheel': wheel.name,
              'sha256': digest,
              'cuda_wheel': cuda_wheel.name,
              'cuda_sha256': hashlib.sha256(cuda_wheel.read_bytes()).hexdigest(),
              'cuda_arch': os.environ['TENSOR0_CUDA_ARCH'],
              'cuda_toolkit': version('/usr/local/cuda/bin/nvcc', '--version'),
              'python': sys.version,
              'rust': version('rustc', '--version'),
              'cxx': version(os.environ['CXX'], '--version'),
              'build_image': 'quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae',
              'workflow_run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'cuda_linkage': 'separate tensor0-cuda12 distribution, typed local CUDA forwarder',
              'cudart_linkage': 'dlopen RTLD_NOLOAD and explicit dlsym on verified external pip runtime; no CUDA DT_NEEDED',
              'cuda_runtime': 'external nvidia-cuda-runtime-cu12>=12.9.79,<13; libcudart.so.12 is not bundled',
              'gpu_execution': 'not tested',
          }
          (directory / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          (directory / 'SHA256SUMS').write_text(''.join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in sorted(directory.iterdir())
              if path.name.endswith(('.whl', '.tar.gz'))))
          PY
          {
            echo '## CUDA compilation and CPU smoke only'
            echo 'No GPU kernels were executed. GPU correctness has NOT been accepted.'
            echo 'Experimental pair: CPython 3.12 core + repaired py3-none-manylinux_2_28_x86_64 addon, CUDA 12.9, sm_80.'
            echo 'Companion repaired with auditwheel manylinux_2_28, without CUDA exclusions or NVIDIA bundling.'
            echo 'Use build-info.json and both exact wheels for manual GPU acceptance.'
            echo 'Manual release candidates reuse the verified CPU producer; automatic runs are compile validation only.'
            echo 'A manual candidate is not accepted until all four candidate-abi-smoke jobs succeed.'
            echo 'Manual candidates feed unified release verification; upload alone is not publication approval.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tensor0-cuda-build-${{ github.sha }}
          path: ${{ runner.temp }}/cuda-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensor0-cuda-build-log-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cuda-build.log
            ${{ runner.temp }}/addon-build.log
          if-no-files-found: ignore
          retention-days: 14

  candidate-abi-smoke:
    name: Exact CPU candidate + same addon / Python ${{ matrix.python }} (no GPU)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: tensor0-cuda-build-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python == '3.15' && '3.15.0' || matrix.python }}
      - name: CPU baseline, add same companion, runtime-only registration
        working-directory: ${{ runner.temp }}
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          cd "$RUNNER_TEMP/candidate"
          sha256sum --check --strict SHA256SUMS
          abi="cp${PYTHON_VERSION//./}"
          uv venv --python '${{ matrix.python == '3.15' && '3.15.0' || matrix.python }}' "$RUNNER_TEMP/abi-test"
          python="$RUNNER_TEMP/abi-test/bin/python"
          uv pip install --python "$python" ./tensor0-*-${abi}-${abi}-manylinux_2_28_x86_64.whl
          uv pip check --python "$python"
          "$python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py"
          "$python" -I - <<'PY'
          import hashlib, os
          from pathlib import Path
          from tensor0 import _native
          assert not _native._stride_cuda_available()
          assert _native._stride_cuda_registration() == {}
          (Path(os.environ['RUNNER_TEMP']) / 'core.sha256').write_text(hashlib.sha256(Path(_native.__file__).read_bytes()).hexdigest())
          PY
          uv pip install --no-deps --python "$python" ./tensor0_cuda12-*.whl
          "$python" -I - <<'PY'
          import importlib.metadata
          from tensor0 import _native
          try:
              importlib.metadata.distribution('nvidia-cuda-runtime-cu12')
          except importlib.metadata.PackageNotFoundError:
              pass
          else:
              raise AssertionError('CPU stage must not have the runtime')
          assert _native._stride_cuda_available()
          try:
              _native._stride_cuda_registration()
          except RuntimeError as error:
              assert 'runtime' in str(error).lower() and 'tensor0[cuda12]' in str(error)
          else:
              raise AssertionError('Expected missing-runtime error')
          PY
          "$python" -I "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py"
          uv pip install --python "$python" 'nvidia-cuda-runtime-cu12>=12.9.79,<13'
          uv pip check --python "$python"
          "$python" -I - <<'PY'
          import hashlib, os
          from pathlib import Path
          from tensor0 import _native
          assert hashlib.sha256(Path(_native.__file__).read_bytes()).hexdigest() == (Path(os.environ['RUNNER_TEMP']) / 'core.sha256').read_text()
          registration = _native._stride_cuda_registration()
          assert len(registration) == 35
          for operation in ('copy', 'update', 'accumulation', 'dot', 'reduction'):
              for dtype in ('f32', 'f64', 'c64', 'c128'):
                  assert f'{operation}_{dtype}' in registration
              stats = getattr(_native, f'_stride_cuda_{operation}_prepared_stats')()
              assert stats is not None and len(stats) == 2
          PY

# SU2 has no corresponding dimension matrix in the reference comparison.
# These explicit cases remain Tensor0's extension to that workload family.
# SU2 sector labels encode twice the spin.

[[case]]
id = "tensor_networks.mpo.su2.float64.d40x5x3"
topology = "mpo"
sector = "su2"
dtype = "float64"
data = "fusion_tree_v1"
dimensions = [40, 5, 3]
validation = "cross_backend"
spaces = [
    { name = "mps", sectors = [[0, 8], [1, 4], [2, 4], [3, 3]] },
    { name = "mpo", sectors = [[0, 1], [1, 2]] },
    { name = "physical", sectors = [[0, 1], [1, 1]] },
]

[[case]]
id = "tensor_networks.pepo.su2.float64.d4x2x2x100"
topology = "pepo"
sector = "su2"
dtype = "float64"
data = "fusion_tree_v1"
dimensions = [4, 2, 2, 100]
validation = "cross_backend"
spaces = [
    { name = "peps", sectors = [[0, 2], [1, 1]] },
    { name = "pepo", sectors = [[0, 2]] },
    { name = "physical", sectors = [[0, 2]] },
    { name = "environment", sectors = [[0, 20], [1, 20], [2, 12], [3, 1]] },
]

[[case]]
id = "tensor_networks.mera.su2.float64.d4"
topology = "mera"
sector = "su2"
dtype = "float64"
data = "fusion_tree_v1"
dimensions = [4]
validation = "cross_backend"
spaces = [
    { name = "factor", sectors = [[0, 2], [1, 1]] },
]

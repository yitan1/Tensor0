schema_version = 1

[profile.smoke]
description = "Small paired MPO checks for protocol and timing validation."
workloads = [
    "tensor_networks.mpo.trivial.float64.d10x4x3",
    "tensor_networks.mpo.z2.float64.d10x4x4",
]
backends = ["tensor0", "tensorkit"]
baseline = "tensorkit"
warmup = 1
repeat = 3
rounds = 2

